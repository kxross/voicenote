<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!--
  Strict sandbox CSP. The widget is AI-generated code, so:
    - default-src 'none'      : nothing loads unless explicitly allowed below
    - script-src 'self' 'unsafe-eval' : our vendored libs (same origin) + Babel/
                                Function() need eval; NO remote scripts
    - connect-src 'none'      : no fetch / XHR / WebSocket — cannot phone home
    - img-src data:           : inline images only, never network
    - style-src 'unsafe-inline': React/Recharts emit inline styles
    - base-uri/form-action 'none' : no base hijack, no form posts
-->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none';
           script-src 'self' 'unsafe-eval';
           style-src 'self' 'unsafe-inline';
           img-src data:;
           font-src 'self' data:;
           connect-src 'none';
           base-uri 'none';
           form-action 'none'">
<style>
  /* Monochrome, OpenAI-clean design tokens. Dark is the default (matches the
     agent card); light is applied when the host sets data-theme="light". */
  :root {
    --bg: #161618;
    --fg: #ededed;
    --muted: #8a8a8f;
    --line: #2e2e32;
    --mono-1: #f5f5f5;
    --mono-2: #c7c7c7;
    --mono-3: #9a9a9a;
    --mono-4: #6e6e6e;
    --mono-5: #3a3a3a;
    --radius: 10px;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --fg: #0d0d0d;
    --muted: #6b6b6b;
    --line: #e5e5e5;
    --mono-1: #111111;
    --mono-2: #444444;
    --mono-3: #777777;
    --mono-4: #aaaaaa;
    --mono-5: #d4d4d4;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;   /* float on the card */
    color: var(--fg);
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  #root { padding: 2px; }
  /* Error card shown if the widget code throws. */
  .canvas-error {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    color: var(--muted);
    font-size: 12.5px;
  }
  .canvas-error b { color: var(--fg); font-weight: 600; }
  .canvas-error pre {
    margin: 8px 0 0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
  }

  /* --- Legibility guardrails for Recharts chrome ---------------------------
     Recharts' Tooltip defaults to a WHITE box, so any theme-light text (axis
     labels, legend) rendered inside it ends up light-on-white and unreadable.
     Force the tooltip and legend onto the theme surface with high-contrast
     text, no matter what the widget code does. These override inline styles,
     so a widget can't accidentally reintroduce low contrast here. */
  .recharts-default-tooltip {
    background: var(--bg) !important;
    border: 1px solid var(--line) !important;
    border-radius: 8px !important;
    box-shadow: none !important;
    color: var(--fg) !important;
    padding: 8px 10px !important;
  }
  .recharts-tooltip-label,
  .recharts-tooltip-item,
  .recharts-tooltip-item-name,
  .recharts-tooltip-item-value,
  .recharts-tooltip-item-separator {
    color: var(--fg) !important;
  }
  /* Legend text sits on the (dark) card — keep it primary-contrast, never the
     muted gray that only works for de-emphasized axis ticks. */
  .recharts-legend-item-text {
    color: var(--fg) !important;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Vendored, pinned, offline. Order matters: Recharts' UMD reads the
     React / PropTypes / ReactDOM globals, so it loads last of the libs.
     Babel transpiles the AI's JSX on-device. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/prop-types.min.js"></script>
<script src="vendor/recharts.min.js"></script>
<script src="vendor/babel.min.js"></script>

<!-- Bootstrap is external (not inline) so the CSP can forbid inline scripts. -->
<script src="boot.js"></script>
</body>
</html>
