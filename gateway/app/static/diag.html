<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway diagnostics</title>
<style>
  :root {
    --bg: #0d0d10; --panel: #16161b; --panel2: #1d1d24; --line: #26262e;
    --txt: #e6e6ea; --mut: #8b8b96; --dim: #5c5c66;
    --ok: #1d9e75; --err: #e24b4a; --warn: #ef9f27; --bar: #378add; --tool: #7f77dd;
    --accent: #378add;
    --j-key:#9ccbf0; --j-str:#8fe3c6; --j-num:#f0c88f; --j-bool:#e59b9b; --j-null:#6c6c78;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.5 system-ui, -apple-system, sans-serif; height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 500; margin: 0; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--mut); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
  .gauge { font-variant-numeric: tabular-nums; }
  .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 49px); }
  .list { border-right: 1px solid var(--line); overflow-y: auto; }
  .list .hd { padding: 10px 16px 4px; color: var(--dim); font-size: 12px; }
  .row { padding: 9px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--panel); }
  .row.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .row .top { display: flex; justify-content: space-between; gap: 8px; }
  .row .mdl { font-weight: 500; }
  .row .tm { color: var(--dim); font-family: ui-monospace, monospace; font-size: 12px; }
  .row .sub { color: var(--mut); font-size: 12.5px; display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .detail { overflow-y: auto; padding: 16px 20px; }
  .empty { color: var(--dim); padding: 40px; text-align: center; }
  .mono { font-family: ui-monospace, monospace; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; align-items: center; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 9px; font-size: 12.5px; color: var(--mut); }
  .chip.ok { background: #0f3a2e; border-color: #145c46; color: #8fe3c6; }
  .chip.err { background: #3a1414; border-color: #5c1f1f; color: #f0a0a0; }
  .chip.run { background: #14263a; border-color: #1f3f5c; color: #9ccbf0; }
  .sdot.run { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .seclabel { color: var(--dim); font-size: 12px; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
  .call { margin-bottom: 6px; }
  .callhd { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 0; flex-wrap: wrap; }
  .calltitle { font-family: ui-monospace, monospace; font-size: 13px; }
  .track { flex: 1; height: 10px; background: var(--panel2); border-radius: 3px; position: relative; min-width: 60px; }
  .fill { height: 100%; background: var(--bar); border-radius: 3px; }
  .ms { color: var(--mut); font-size: 12px; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .tool { margin: 2px 0 2px 18px; font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--mut); }
  .tool .tn { color: var(--tool); }
  .tool.err .tn { color: var(--err); }
  /* provider badge — shows which LLM endpoint a call was routed to */
  .pv { font-family: ui-monospace, monospace; font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--mut); text-transform: uppercase; letter-spacing: .04em; flex: none; }
  .pv.ollama { background:#14263a; border-color:#27496b; color:#9ccbf0; }
  .pv.vllm { background:#1e1a3a; border-color:#3a3270; color:#bcb2f2; }
  .pv.openrouter { background:#3a2a14; border-color:#6b4c22; color:#f0c88f; }
  .pv.kev, .pv.jev { background:#0f3a2e; border-color:#1d6b52; color:#8fe3c6; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font-size: 12.5px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
  pre .jlabel, .jbox .jlabel { color: var(--dim); text-transform: uppercase; letter-spacing: .05em; font-size: 11px; display: block; margin: 8px 0 2px; }
  .jbox .jlabel:first-child { margin-top: 0; }
  .j-key { color: var(--j-key); } .j-str { color: var(--j-str); }
  .j-num { color: var(--j-num); } .j-bool { color: var(--j-bool); } .j-null { color: var(--j-null); }
  /* caret-controlled collapsible JSON tree */
  .jbox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font-size: 12.5px; margin: 6px 0;
    font-family: ui-monospace, monospace; }
  .jtree details { margin: 0; }
  .jtree summary { cursor: pointer; list-style: none; display: inline-block; }
  .jtree summary::-webkit-details-marker { display: none; }
  .jtree summary::before { content: '▸'; color: var(--dim); display: inline-block; width: 12px; }
  .jtree details[open] > summary::before { content: '▾'; }
  .jtree .jc { margin-left: 6px; padding-left: 10px; border-left: 1px solid var(--line); }
  .jrow { white-space: pre-wrap; word-break: break-word; }
  .j-pun { color: var(--mut); } .j-cnt { color: var(--dim); font-size: 11px; }
  .j-rawstr { white-space: pre-wrap; word-break: break-word; color: var(--j-str); }
  .exp { display: none; }
  .exp.open { display: block; }
  .caret { color: var(--dim); font-size: 11px; width: 12px; }
  button.link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12.5px; padding: 0; }
  h3 { font-size: 14px; font-weight: 500; margin: 18px 0 4px; }
  .backbtn { display: none; align-items: center; gap: 6px; background: var(--panel2);
    border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 7px 13px;
    cursor: pointer; margin-bottom: 12px; font-size: 13px; }
  /* ---- mobile ---- */
  @media (max-width: 760px) {
    body { height: auto; overflow: auto; }
    .layout { grid-template-columns: 1fr; height: auto; }
    .list { border-right: none; border-bottom: 1px solid var(--line); overflow-y: visible; }
    .detail { padding: 14px; }
    .backbtn { display: inline-flex; }
    body.detail-open .list { display: none; }
    body:not(.detail-open) .detail { display: none; }
    .live { margin-left: 0; width: 100%; }
    header h1 { font-size: 15px; }
    pre { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>Gateway diagnostics</h1>
  <div class="live">
    <span class="gauge" id="gauge">– running · – queued</span>
    <span class="dot" id="livedot"></span><span id="livetxt">connecting…</span>
  </div>
</header>
<div class="layout">
  <div class="list">
    <div class="hd">Recent traces</div>
    <div id="rows"></div>
  </div>
  <div class="detail" id="detail"><div class="empty">Select a trace to inspect its model round-trips.</div></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtTime = t => new Date(t*1000).toLocaleTimeString();
const sc = { ok:'var(--ok)', error:'var(--err)', timeout:'var(--warn)', running:'var(--bar)', paused:'var(--warn)' };
const statusText = t => t.status==='ok' ? (t.duration_ms/1000).toFixed(1)+'s'
  : t.status==='running' ? 'running · '+(t.duration_ms/1000).toFixed(0)+'s'
  : esc(t.status);
let traces = [], selected = null, maxBar = 1;

// --- provider helpers: which LLM endpoint handled a call ---
const provOf = c => ((c && c.request && c.request.provider) || 'ollama');
function pvClass(p){ p=(p||'').toLowerCase();
  if(p.startsWith('vllm')) return 'vllm';
  if(p.startsWith('openrouter')) return 'openrouter';
  if(p.startsWith('ollama')) return 'ollama';
  if(p === 'kev' || p === 'jev') return p;
  return ''; }
const pvBadge = p => `<span class="pv ${pvClass(p)}">${esc(p)}</span>`;

// --- JSON rendering: parse nested JSON strings, then syntax-highlight ---
function deepParse(v){
  if (typeof v === 'string'){
    const s = v.trim();
    if (s && (s[0]==='{' || s[0]==='[')){
      try { return deepParse(JSON.parse(v)); } catch(e){ return v; }
    }
    return v;
  }
  if (Array.isArray(v)) return v.map(deepParse);
  if (v && typeof v === 'object'){ const o={}; for (const k in v) o[k]=deepParse(v[k]); return o; }
  return v;
}
// Recursive collapsible tree. Every object/array is a <details> with its own
// caret (▸/▾), so depth is caret-controlled at each level. Shallow levels start
// open; deeper ones start collapsed.
const OPEN_DEPTH = 2;
function jsonTree(v, depth){
  depth = depth || 0;
  if (v === null) return '<span class="j-null">null</span>';
  const t = typeof v;
  if (t === 'number') return `<span class="j-num">${esc(v)}</span>`;
  if (t === 'boolean') return `<span class="j-bool">${v}</span>`;
  if (t === 'string') return `<span class="j-str">${esc(JSON.stringify(v))}</span>`;
  const op = depth < OPEN_DEPTH ? ' open' : '';
  if (Array.isArray(v)){
    if (!v.length) return '<span class="j-pun">[ ]</span>';
    const rows = v.map((x,i)=>`<div class="jrow">${jsonTree(x, depth+1)}${i<v.length-1?'<span class="j-pun">,</span>':''}</div>`).join('');
    return `<details${op}><summary><span class="j-pun">[</span> <span class="j-cnt">${v.length}</span> <span class="j-pun">]</span></summary><div class="jc">${rows}</div></details>`;
  }
  const keys = Object.keys(v);
  if (!keys.length) return '<span class="j-pun">{ }</span>';
  const rows = keys.map((k,i)=>`<div class="jrow"><span class="j-key">${esc(JSON.stringify(k))}</span><span class="j-pun">: </span>${jsonTree(v[k], depth+1)}${i<keys.length-1?'<span class="j-pun">,</span>':''}</div>`).join('');
  return `<details${op}><summary><span class="j-pun">{</span> <span class="j-cnt">${keys.length}</span> <span class="j-pun">}</span></summary><div class="jc">${rows}</div></details>`;
}
function jsonHtml(v){
  let obj; try { obj = deepParse(v); } catch(e){ obj = v; }
  // deepParse left a string → it didn't parse (usually a truncated large field
  // capped for storage). If it still looks like JSON, unescape it so it reads
  // cleanly instead of as \"escaped\" soup; otherwise show the plain string.
  if (typeof obj === 'string'){
    let s = obj;
    if (/^\s*[\[{]/.test(obj)){
      s = obj.replace(/\\"/g,'"').replace(/\\n/g,'\n').replace(/\\t/g,'\t')
             .replace(/\\r/g,'').replace(/\\\//g,'/').replace(/\\\\/g,'\\');
    }
    return `<div class="j-rawstr">${esc(s)}</div>`;
  }
  return `<div class="jtree">${jsonTree(obj, 0)}</div>`;
}

function renderList() {
  $('#rows').innerHTML = traces.map(t => `
    <div class="row ${t.id===selected?'sel':''}" onclick="select('${t.id}')">
      <div class="top"><span class="mdl">${esc(t.model)}</span><span class="tm">${fmtTime(t.created_at)}</span></div>
      <div class="sub"><span class="sdot ${t.status==='running'?'run':''}" style="background:${sc[t.status]||'var(--dim)'}"></span>
        ${esc(t.trigger)} · ${statusText(t)} · ${t.num_calls} call${t.num_calls===1?'':'s'}</div>
    </div>`).join('');
}

async function select(id) {
  selected = id; renderList();
  document.body.classList.add('detail-open');
  const t = await (await fetch('/diag/traces/'+id)).json();
  const calls = t.calls || [];
  maxBar = Math.max(1, ...calls.map(c => c.duration_ms));
  // Which endpoints did this turn's traffic hit? (unique, in order seen)
  const provs = [...new Set(calls.map(provOf))];
  const provChips = provs.map(pvBadge).join(' ');
  $('#detail').innerHTML = `
    <button class="backbtn" onclick="closeDetail()">← traces</button>
    <div class="mono" style="font-weight:500">${esc(t.trigger.startsWith('schedule')?t.trigger:'POST /v1/chat/completions')}</div>
    <div style="color:var(--mut);font-size:13px;margin-top:2px">${esc(t.model)} · session ${esc(t.session||'—')} · ${esc(t.trigger)}</div>
    <div class="chips">
      <span class="chip">${(t.duration_ms/1000).toFixed(1)}s total</span>
      <span class="chip">${t.num_calls} call${t.num_calls===1?'':'s'}</span>
      <span class="chip">${t.num_ops} op${t.num_ops===1?'':'s'}</span>
      ${t.num_images ? `<span class="chip">📷 ${t.num_images}</span>` : ''}
      <span class="chip ${t.status==='ok'?'ok':t.status==='running'?'run':'err'}">${esc(t.status)}</span>
    </div>
    ${provs.length ? `<div class="chips">routed to: ${provChips}</div>` : ''}
    <div class="seclabel">Model round-trips</div>
    ${calls.map((c,i)=>callHtml(c,i)).join('') || '<div style="color:var(--dim)">no calls recorded</div>'}
    <h3>Response envelope</h3>
    <div class="jbox">${jsonHtml(t.response)}</div>
    <p><button class="link" onclick="toggle('req')">▸ raw request</button></p>
    <div id="req" class="jbox exp">${jsonHtml(t.request)}</div>`;
}
function closeDetail(){ document.body.classList.remove('detail-open'); }

function callHtml(c, i) {
  const w = Math.round(c.duration_ms / maxBar * 100);
  const tools = (c.tools||[]).map((tl,j)=>`
    <div class="tool ${tl.error?'err':''}">
      <span onclick="toggle('t${i}_${j}')" style="cursor:pointer">↳ <span class="tn">${esc(tl.name)}</span>(${esc(shortArgs(tl.args))}) → ${esc(shortResult(tl.result))} · ${tl.duration_ms}ms</span>
      <div id="t${i}_${j}" class="exp jbox"><span class="jlabel">args</span>${jsonHtml(tl.args)}<span class="jlabel">result</span>${jsonHtml(tl.result)}${tl.error?'<span class="jlabel">error</span><div class="j-rawstr" style="color:var(--err)">'+esc(String(tl.error))+'</div>':''}</div>
    </div>`).join('');
  return `<div class="call">
    <div class="callhd" onclick="toggle('c${i}')">
      <span class="caret" id="c${i}_c">▸</span>
      <span class="calltitle">${i+1} · ${callLabel(c)}</span>
      ${pvBadge(provOf(c))}
      <span class="track"><span class="fill" style="width:${w}%"></span></span>
      <span class="ms">${(c.duration_ms/1000).toFixed(2)}s</span>
    </div>
    ${tools}
    <div id="c${i}" class="exp jbox"><span class="jlabel">request</span>${jsonHtml(c.request)}<span class="jlabel">response</span>${jsonHtml(c.response)}</div>
  </div>`;
}

function callLabel(c) {
  const tc = (c.response && c.response.tool_calls) || [];
  if (tc.length) return tc.map(x => (x.function && x.function.name) || '?').join(', ');
  const content = (c.response && c.response.content) || '';
  return content ? 'final reply' : 'call';
}
function shortArgs(a){ const s = typeof a==='string'?a:JSON.stringify(a); return s.length>60?s.slice(0,60)+'…':s; }
function shortResult(r){ const s = typeof r==='string'?r:JSON.stringify(r); return s.length>40?s.slice(0,40)+'…':s; }
function toggle(id){ const el=$('#'+id); if(el){ el.classList.toggle('open'); const c=$('#'+id+'_c'); if(c) c.textContent = el.classList.contains('open')?'▾':'▸'; } }

function setGauge(s){ $('#gauge').textContent = `${s.in_flight} running · ${s.queued} queued`; }

async function loadTraces() {
  const data = await (await fetch('/diag/traces')).json();
  traces = data.traces; renderList();
  // If a still-running trace is open, re-pull its detail so its model calls
  // and elapsed time grow live.
  if (selected && traces.some(t => t.id===selected && t.status==='running')) select(selected);
}

async function boot() {
  await loadTraces();
  // Poll so in-flight runs appear and tick even between finish events (which
  // only fire when a run completes).
  setInterval(loadTraces, 2000);
  const ev = new EventSource('/diag/stream');
  ev.onopen = () => { $('#livedot').style.background='var(--ok)'; $('#livetxt').textContent='live'; };
  ev.onerror = () => { $('#livedot').style.background='var(--err)'; $('#livetxt').textContent='reconnecting…'; };
  ev.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'stats') setGauge(m.stats);
    else if (m.type === 'trace') loadTraces();  // a run finished — reload so it moves running → done
  };
}
boot();
</script>
</body>
</html>
